# Run locally (PowerShell):
#   $env:SECRET_KEY = "<64 hex characters>"
#   docker compose up --build -d
# Jenkins deploy: IMAGE / IMAGE_TAG / SECRET_KEY are provided by the Jenkinsfile.

services:
  fraudguard:
    image: ${IMAGE:-fraudguard-app}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name: Docker Compose manages container names
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (64 hex characters)}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_PATH: /app/data/fraudguard.db
      MODEL_DIR: artifacts
      ML_SERVICE_URL: http://127.0.0.1:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/oauth/google/callback}
      SMTP_ENABLED: ${SMTP_ENABLED:-False}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - fraudguard_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  fraudguard_data:
    driver: local