services:
  fraudguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudguard-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=production-secure-key-replace-with-env-secret-32-chars
      - CORS_ORIGINS=["http://localhost:8000","http://127.0.0.1:8000"]
      - MODEL_DIR=artifacts
      - ML_SERVICE_URL=http://localhost:8000
    volumes:
      - fraudguard_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fraudguard_data:
    driver: local
