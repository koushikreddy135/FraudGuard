apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudguard-backend
  labels:
    app: fraudguard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraudguard-backend
  template:
    metadata:
      labels:
        app: fraudguard-backend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: fraudguard-backend:7-fb9d957
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fraudguard-config
            - secretRef:
                name: fraudguard-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: fraudguard-data
              mountPath: /app/data
      volumes:
        - name: fraudguard-data
          persistentVolumeClaim:
            claimName: fraudguard-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraudguard-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: fraudguard-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: fraudguard-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudguard-frontend
  labels:
    app: fraudguard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraudguard-frontend
  template:
    metadata:
      labels:
        app: fraudguard-frontend
    spec:
      containers:
        - name: frontend
          image: fraudguard-frontend:7-fb9d957
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: fraudguard-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: fraudguard-frontend
